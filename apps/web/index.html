<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050605" />
    <meta
      name="description"
      content="VibeTrace inspects public websites for AI-development signals, technology fingerprints, passive security posture, performance, quality, SEO and accessibility — with evidence and explicit limitations."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VibeTrace — website forensics for AI-era builds</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("vibetrace:settings");
          var theme = raw ? JSON.parse(raw).theme : "dark";
          var resolved =
            theme === "light"
              ? "light"
              : theme === "dark"
                ? "dark"
                : window.matchMedia("(prefers-color-scheme: light)").matches
                  ? "light"
                  : "dark";
          document.documentElement.dataset.theme = resolved;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", resolved === "light" ? "#f4f5ef" : "#050605");
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
